name: Process Engine Logs & Deploy to GitHub Pages

on:
  # Trigger when raw data or scripts are updated on main (e.g. after PR merge)
  push:
    branches:
      - main
    paths:
      - "raw_data/**"
      - "scripts/**"
      - "config.json"
      - "docs/css/**"
      - "docs/js/**"
      - "docs/*.html"

  # Allow manual re-runs from the Actions tab
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: "Force re-process all files (even if unchanged)"
        required: false
        default: false
        type: boolean
      refetch_adsb:
        description: "Re-fetch ADS-B data even if already cached"
        required: false
        default: false
        type: boolean

# Permissions needed to push back to the repo and deploy Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping runs
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Process raw CSV logs → JSON files in docs/data/
  # ---------------------------------------------------------------------------
  process:
    name: Process Engine Logs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Process engine logs
        run: |
          python scripts/process_logs.py \
            ${{ github.event.inputs.force_reprocess == 'true' && '--force' || '' }}

      - name: Diagnose FlightAware API key
        run: |
          echo "Key length: ${#FLIGHTAWARE_API_KEY}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-apikey: ${FLIGHTAWARE_API_KEY}" \
            "https://aeroapi.flightaware.com/aeroapi/flights/CGJYY?max_pages=1")
          echo "FlightAware curl response: $HTTP"
        env:
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}

      - name: Fetch ADS-B track data (optional)
        run: |
          python scripts/fetch_adsb.py \
            ${{ github.event.inputs.refetch_adsb == 'true' && '--refetch' || '' }}
        env:
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
          OPENSKY_USER:        ${{ secrets.OPENSKY_USER }}
          OPENSKY_PASS:        ${{ secrets.OPENSKY_PASS }}
        # Don't fail the whole workflow if ADS-B fetch fails
        continue-on-error: true

      - name: Commit processed data back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update processed flight data [skip ci]"
            git push
          fi

  # ---------------------------------------------------------------------------
  # Job 2: Deploy docs/ to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: process

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository (post-process)
        uses: actions/checkout@v4
        with:
          ref: main     # fetch the updated main (with newly committed data)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
